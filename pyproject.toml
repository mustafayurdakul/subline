[project]
name = "gametl"
version = "0.1.0"
description = "Real-time in-game text translation overlay for Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bugs" }]
keywords = ["translation", "overlay", "ocr", "games", "subtitles", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # capture and OCR
    "windows-capture",
    "rapidocr>=3.0",
    "onnxruntime-directml>=1.19",  # CPU and DirectML (any DirectX 12 GPU) providers in one package
    "opencv-python-headless>=4.9",
    "numpy",
    "pillow>=10",
    # overlay and settings window
    "pyside6>=6.8",
    # translation backends: Claude, DeepL (requests), offline CTranslate2 models
    "anthropic",
    "requests>=2.31",
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
]

[project.scripts]
gametl = "gametl.app.main:main"
gametl-pretranslate = "gametl.app.pretranslate:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gametl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "N"]
ignore = [
    "RUF001",  # ambiguous unicode: Turkish text and the ellipsis character are intended
    "RUF012",  # mutable class attributes: Qt signal declarations
    "N802",    # Qt overrides keep their camelCase names (paintEvent, nativeEventFilter)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # Qt env setup before the PySide6 imports
