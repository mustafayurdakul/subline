# Test, then build the packaged folder and its installer on a Windows
# runner and publish both.
#
# Three ways to cut a release; all must agree with __version__ in
# src/gametl/__init__.py (pyproject.toml reads the version from there):
#
#   a merge to main that carries a version no tag exists for yet
#       releases that version: the tag v<version> is created at the merge
#       commit and the installer and the zip attached to its release (a
#       merge whose version is already tagged builds nothing)
#   git tag v0.2.0 && git push origin v0.2.0
#       the same for an explicit tag (a tag with a dash, v0.2.0-beta1,
#       becomes a pre-release)
#   Actions > Release > Run workflow
#       with a tag name: the same, from the Actions tab; with the tag left
#       empty: builds without releasing and keeps the installer and the
#       zip as artifacts, to try the build first
#
# Every run that builds runs CI's lint and tests first, so a tag pushed by
# hand, a run from the Actions tab or a merge released before CI finishes
# does not ship a red build.
#
# The executables are not code-signed here: Windows shows "unknown
# publisher" for them until a signing step (a cloud signing service) is added.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create at this commit, e.g. v0.2.0 (empty: build only, keep the installer and the zip as artifacts)"
        required: false
        default: ""

# Read-only by default; only the build job, which creates the release, may write.
permissions:
  contents: read

jobs:
  decide:
    # Cheap and first: which tag (if any) this run releases, and whether to build at all.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/gametl/__init__.py | head -1)
          if [ -z "$version" ]; then
            echo 'no __version__ = "..." line in src/gametl/__init__.py' >&2
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="$GITHUB_REF_NAME"; build=true ;;
            *)
              if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                tag="$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')"; build=true
              elif git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
                tag=""; build=false   # main is already released at this version
              else
                tag="v$version"; build=true   # a new version on main: release it
              fi ;;
          esac
          if [ -n "$tag" ] && [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match version $version in src/gametl/__init__.py" >&2
            exit 1
          fi
          echo "version $version, tag '${tag}', build $build"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  test:
    # The same lint and tests as ci.yml's test job.
    needs: decide
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Tests
        # The overlay window and hotkey-registration tests need an interactive
        # desktop session, which hosted runners do not provide.
        run: >
          uv run pytest -q
          --ignore=tests/test_overlay_window.py
          --ignore=tests/test_hotkeys.py

  build:
    needs: [decide, test]
    if: needs.decide.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write # creates the tag and the release
    env:
      QT_QPA_PLATFORM: offscreen # the app icon is rendered with Qt during the build
      RELEASE_TAG: ${{ needs.decide.outputs.tag }}
      RELEASE_VERSION: ${{ needs.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # the build runs third-party code; only the publish step gets the token
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --group build

      - name: Name the archive
        id: name
        shell: pwsh
        run: |
          $label = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "${{ github.sha }}".Substring(0, 7) }
          "zip=gametl-$label-win64.zip" >> $env:GITHUB_OUTPUT
          "setup=Subline-v${env:RELEASE_VERSION}-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Build
        # The portable folder, then the installer around it (Inno Setup 6 is
        # on the Windows runner image).
        run: uv run --group build python scripts/build.py --clean --installer

      - name: Settings window in the frozen app
        # The same check as CI's build job, on the folder that ships.
        run: dist\gametl\gametl-cli.exe --check-ui

      - name: Zip
        shell: pwsh
        run: 7z a -mx=5 "${{ steps.name.outputs.zip }}" ./dist/gametl

      - name: Publish the release
        if: needs.decide.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/${{ steps.name.outputs.setup }}
            ${{ steps.name.outputs.zip }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.decide.outputs.tag, '-') }}

      - name: Keep the build as an artifact
        if: needs.decide.outputs.tag == ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.zip }}
          path: |
            ${{ steps.name.outputs.zip }}
            dist/${{ steps.name.outputs.setup }}
          retention-days: 7
