# Build the packaged folder on a Windows runner and publish it.
#
#   git tag v0.2.0 && git push origin v0.2.0
#       builds dist/gametl, zips it and attaches the zip to a GitHub release
#       for the tag (a tag with a dash, v0.2.0-beta1, becomes a pre-release)
#   Actions > Release > Run workflow, with a tag name such as v0.2.0
#       the same, from the Actions tab: the tag is created at the chosen
#       commit when the release is published
#   Actions > Release > Run workflow, tag left empty
#       builds without releasing and keeps the zip as a workflow artifact,
#       to try the build first
#
# The tag must match the version in pyproject.toml. The executables are not
# code-signed here: Windows shows "unknown publisher" for them until a
# signing step (a cloud signing service) is added.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create at this commit, e.g. v0.2.0 (empty: build only, keep the zip as an artifact)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen # the app icon is rendered with Qt during the build
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group build

      - name: Work out the release tag and the archive name
        id: tag
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { $env:INPUT_TAG.Trim() }
          $label = if ($tag) { $tag } else { "${{ github.sha }}".Substring(0, 7) }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "zip=gametl-$label-win64.zip" >> $env:GITHUB_OUTPUT

      - name: Check that the tag matches the project version
        if: steps.tag.outputs.tag != ''
        shell: pwsh
        run: |
          $version = (uv version --short).Trim()
          if ("v$version" -ne "${{ steps.tag.outputs.tag }}") {
            throw "tag ${{ steps.tag.outputs.tag }} does not match pyproject.toml version $version"
          }

      - name: Build
        run: uv run --group build python scripts/build.py --clean

      - name: Zip
        shell: pwsh
        run: 7z a -mx=5 "${{ steps.tag.outputs.zip }}" ./dist/gametl

      - name: Publish the release
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.tag.outputs.zip }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}

      - name: Keep the build as an artifact
        if: steps.tag.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.zip }}
          path: ${{ steps.tag.outputs.zip }}
          retention-days: 7
