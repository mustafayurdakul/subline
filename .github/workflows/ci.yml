name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint and format
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Tests
        # The overlay window and hotkey-registration tests need an interactive
        # desktop session, which hosted runners do not provide.
        run: >
          uv run pytest -q
          --ignore=tests/test_overlay_window.py
          --ignore=tests/test_hotkeys.py

  build:
    # The frozen app must still find its QML pages and Qt's QML modules:
    # build it as a release would and load every settings page from the exe.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --group build
      - name: Build
        # The folder and the installer: a broken installer/subline.iss fails here, not at release time.
        run: uv run --group build python scripts/build.py --installer
      - name: Settings window in the frozen app
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist\gametl\gametl-cli.exe --check-ui
